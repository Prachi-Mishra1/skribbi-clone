<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Skribbl Clone 🎨</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/socket.io-client/dist/socket.io.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0f0f1a;color:#fff;min-height:100vh}
.btn{padding:12px 24px;border:none;border-radius:10px;cursor:pointer;font-size:16px;font-weight:700}
.btn-primary{background:#4f46e5;color:#fff}
.btn-green{background:#22c55e;color:#fff}
input{padding:12px;border-radius:10px;border:2px solid #2d2d4e;background:#0f0f1a;color:#fff;font-size:16px;outline:none;width:100%}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const BACKEND = 'http://localhost:3001';

function App() {
  const [screen, setScreen] = useState('home');
  const [state, setState] = useState({
    roomCode:'', player:null, players:[], settings:{maxPlayers:8,rounds:3,drawTime:80,wordCount:3},
    phase:'lobby', round:1, totalRounds:3, drawerId:'', drawerName:'',
    currentWord:null, hint:'', timeLeft:0, chatMessages:[], wordOptions:[],
    lastRoundWord:'', winner:null, leaderboard:[]
  });
  const [error, setError] = useState('');
  const [connected, setConnected] = useState(false);
  const socketRef = useRef(null);
  const canvasRef = useRef(null);
  const strokesRef = useRef([]);
  const currentStrokeRef = useRef([]);
  const isDrawingRef = useRef(false);
  const [color, setColor] = useState('#000000');
  const [brushSize, setBrushSize] = useState(6);
  const [tool, setTool] = useState('pen');

  useEffect(() => {
    const socket = io(BACKEND);
    socketRef.current = socket;
    socket.on('connect', () => setConnected(true));
    socket.on('disconnect', () => setConnected(false));
    socket.on('room_created', d => { setState(s=>({...s,...d})); setScreen('lobby'); setError(''); });
    socket.on('room_joined', d => { setState(s=>({...s,...d,chatMessages:d.chatMessages||[]})); setScreen('lobby'); setError(''); });
    socket.on('player_joined', d => setState(s=>({...s,players:d.players})));
    socket.on('player_left', d => setState(s=>({...s,players:d.players})));
    socket.on('error', d => setError(d.message));
    socket.on('game_started', d => { setState(s=>({...s,players:d.players,round:d.round,totalRounds:d.totalRounds,phase:'word_selection',chatMessages:[]})); setScreen('game'); });
    socket.on('word_options', d => setState(s=>({...s,wordOptions:d.words,phase:'word_selection'})));
    socket.on('round_start', d => { setState(s=>({...s,drawerId:d.drawerId,drawerName:d.drawerName,round:d.round,totalRounds:d.totalRounds,phase:'word_selection',wordOptions:[],currentWord:null,hint:''})); clearCanvas(); });
    socket.on('drawing_start', d => { setState(s=>({...s,phase:'drawing',currentWord:d.word,hint:d.hint,drawerId:d.drawerId||s.drawerId,drawerName:d.drawerName||s.drawerName,timeLeft:d.drawTime,wordOptions:[]})); clearCanvas(); });
    socket.on('timer_update', d => setState(s=>({...s,timeLeft:d.timeLeft})));
    socket.on('hint_update', d => setState(s=>({...s,hint:d.hint})));
    socket.on('guess_result', d => { if(d.correct&&d.players) setState(s=>({...s,players:d.players,player:d.players.find(p=>p.id===s.player?.id)||s.player})); });
    socket.on('chat_message', d => setState(s=>({...s,chatMessages:[...s.chatMessages,d]})));
    socket.on('draw_data', d => receiveDrawData(d));
    socket.on('canvas_cleared', () => clearCanvas());
    socket.on('draw_undo', d => { strokesRef.current=d.strokes; redrawCanvas(); });
    socket.on('round_end', d => setState(s=>({...s,phase:'round_end',lastRoundWord:d.word,players:d.players,player:d.players.find(p=>p.id===s.player?.id)||s.player})));
    socket.on('next_round', d => setState(s=>({...s,...d,player:d.players.find(p=>p.id===s.player?.id)||s.player,phase:'word_selection',currentWord:null,hint:'',wordOptions:[]})));
    socket.on('game_over', d => setState(s=>({...s,phase:'game_over',winner:d.winner,leaderboard:d.leaderboard})));
    return () => socket.disconnect();
  }, []);

  const getCtx = () => canvasRef.current?.getContext('2d');

  const clearCanvas = () => {
    strokesRef.current = []; currentStrokeRef.current = [];
    const ctx = getCtx(); const c = canvasRef.current;
    if(ctx&&c){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);}
  };

  const redrawCanvas = () => {
    const ctx = getCtx(); const c = canvasRef.current;
    if(!ctx||!c) return;
    ctx.clearRect(0,0,c.width,c.height); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
    [...strokesRef.current, currentStrokeRef.current].forEach(stroke => {
      if(!stroke?.length) return;
      const s = stroke[0];
      ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.globalCompositeOperation = s.tool==='eraser'?'destination-out':'source-over';
      ctx.strokeStyle = s.tool==='eraser'?'rgba(0,0,0,1)':(s.color||'#000');
      ctx.lineWidth = s.size||6; ctx.beginPath();
      let moved=false;
      stroke.forEach(pt=>{ if(pt.x==null)return; if(!moved){ctx.moveTo(pt.x,pt.y);moved=true;}else ctx.lineTo(pt.x,pt.y); });
      ctx.stroke(); ctx.restore();
    });
  };

  const receiveDrawData = (data) => {
    if(data.type==='start') currentStrokeRef.current=[data];
    else if(data.type==='move') currentStrokeRef.current.push(data);
    else if(data.type==='end'){strokesRef.current.push([...currentStrokeRef.current]);currentStrokeRef.current=[];}
    redrawCanvas();
  };

  const getPos = (e) => {
    const c = canvasRef.current; const rect = c.getBoundingClientRect();
    const scaleX=c.width/rect.width, scaleY=c.height/rect.height;
    if(e.touches) return {x:(e.touches[0].clientX-rect.left)*scaleX,y:(e.touches[0].clientY-rect.top)*scaleY};
    return {x:(e.clientX-rect.left)*scaleX,y:(e.clientY-rect.top)*scaleY};
  };

  const handleMouseDown = (e) => {
    if(!state.player||state.drawerId!==state.player.id||state.phase!=='drawing') return;
    isDrawingRef.current=true;
    const pos=getPos(e);
    const data={type:'start',x:pos.x,y:pos.y,color,size:brushSize,tool};
    currentStrokeRef.current=[data];
    socketRef.current?.emit('draw_start',{x:pos.x,y:pos.y,color,size:brushSize,tool});
    const ctx=getCtx();
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';
    ctx.strokeStyle=tool==='eraser'?'rgba(0,0,0,1)':color;
    ctx.lineWidth=brushSize; ctx.beginPath(); ctx.moveTo(pos.x,pos.y);
  };

  const handleMouseMove = (e) => {
    if(!isDrawingRef.current) return; e.preventDefault();
    const pos=getPos(e);
    currentStrokeRef.current.push({type:'move',x:pos.x,y:pos.y});
    socketRef.current?.emit('draw_move',{x:pos.x,y:pos.y});
    const ctx=getCtx(); ctx.lineTo(pos.x,pos.y); ctx.stroke();
  };

  const handleMouseUp = () => {
    if(!isDrawingRef.current) return; isDrawingRef.current=false;
    strokesRef.current.push([...currentStrokeRef.current]);
    currentStrokeRef.current=[];
    socketRef.current?.emit('draw_end',{});
  };

  if(screen==='home') return <HomeScreen connected={connected} error={error} onCreate={(name,settings)=>socketRef.current?.emit('create_room',{playerName:name,settings,isPrivate:false})} onJoin={(name,code)=>socketRef.current?.emit('join_room',{roomCode:code,playerName:name})} onScreenChange={setScreen} />;
  if(screen==='lobby') return <LobbyScreen state={state} onStart={()=>socketRef.current?.emit('start_game',{})} />;

  const isDrawer = state.player?.id===state.drawerId;

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',background:'#0f0f1a'}}>
      <div style={{display:'flex',alignItems:'center',padding:'8px 16px',background:'#1a1a2e',borderBottom:'1px solid #2d2d4e',gap:'12px',flexWrap:'wrap'}}>
        <span style={{fontWeight:800,fontSize:'20px',color:'#818cf8'}}>🎨 Skribbl</span>
        <span style={{background:'#4f46e5',color:'#fff',padding:'3px 10px',borderRadius:'99px',fontSize:'13px',fontWeight:800}}>Round {state.round}/{state.totalRounds}</span>
        <div style={{flex:1,textAlign:'center'}}>
          {state.phase==='drawing'&&(isDrawer?<span style={{color:'#a5b4fc'}}>Drawing: <b>{state.currentWord}</b></span>:<span style={{fontWeight:800,fontSize:'20px',letterSpacing:'6px'}}>{state.hint}</span>)}
          {state.phase==='word_selection'&&<span style={{color:'#6b7280'}}>{isDrawer?'👆 Pick a word!':'⏳ '+state.drawerName+' is choosing...'}</span>}
          {state.phase==='round_end'&&<span>Word was: <b style={{color:'#f59e0b'}}>{state.lastRoundWord}</b></span>}
        </div>
        {state.phase==='drawing'&&<span style={{fontWeight:800,fontSize:'20px',color:state.timeLeft<=10?'#ef4444':'#22c55e'}}>⏱{state.timeLeft}s</span>}
      </div>

      <div style={{flex:1,display:'flex',gap:'8px',padding:'8px',overflow:'hidden'}}>
        <div style={{width:'150px',flexShrink:0,background:'#1a1a2e',borderRadius:'12px',overflow:'hidden'}}>
          <div style={{padding:'8px 12px',background:'#0f0f1a',fontWeight:800,fontSize:'13px',color:'#a5b4fc'}}>🏆 Players</div>
          {[...state.players].sort((a,b)=>b.score-a.score).map((p,i)=>(
            <div key={p.id} style={{display:'flex',alignItems:'center',gap:'6px',padding:'6px 10px',background:p.id===state.player?.id?'#1e1e3a':'transparent',borderLeft:p.isDrawing?'3px solid #4f46e5':'3px solid transparent'}}>
              <div style={{width:28,height:28,borderRadius:'50%',background:p.avatar,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:'12px',color:'#fff',flexShrink:0}}>{p.name[0].toUpperCase()}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:'12px',fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</div>
                <div style={{fontSize:'11px',color:'#818cf8'}}>{p.score}pts</div>
              </div>
              {p.hasGuessed&&!p.isDrawing&&<span>✅</span>}
            </div>
          ))}
        </div>

        <div style={{flex:1,display:'flex',flexDirection:'column',gap:'8px',minWidth:0}}>
          {isDrawer&&state.phase==='drawing'&&(
            <div style={{display:'flex',gap:'6px',alignItems:'center',flexWrap:'wrap',background:'#1a1a2e',padding:'8px',borderRadius:'10px'}}>
              <button onClick={()=>setTool('pen')} style={{padding:'4px 8px',borderRadius:'6px',border:'none',background:tool==='pen'?'#4f46e5':'#2d2d4e',color:'#fff',cursor:'pointer'}}>✏️</button>
              <button onClick={()=>setTool('eraser')} style={{padding:'4px 8px',borderRadius:'6px',border:'none',background:tool==='eraser'?'#4f46e5':'#2d2d4e',color:'#fff',cursor:'pointer'}}>🧹</button>
              {[3,6,12,20].map(s=><button key={s} onClick={()=>setBrushSize(s)} style={{width:28,height:28,borderRadius:'50%',border:`2px solid ${brushSize===s?'#4f46e5':'#555'}`,background:'#2d2d4e',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><div style={{width:Math.min(s*1.2,20),height:Math.min(s*1.2,20),borderRadius:'50%',background:color}}/></button>)}
              {['#000000','#FFFFFF','#FF0000','#FF6B00','#FFD700','#00CC00','#0066FF','#8B00FF','#FF69B4','#8B4513','#808080','#00FFFF'].map(c=><button key={c} onClick={()=>{setColor(c);setTool('pen')}} style={{width:22,height:22,borderRadius:'4px',border:`2px solid ${color===c?'#fff':'transparent'}`,background:c,cursor:'pointer'}}/>)}
              <button onClick={()=>{socketRef.current?.emit('draw_undo',{});}} style={{padding:'4px 8px',borderRadius:'6px',border:'none',background:'#2d2d4e',color:'#fff',cursor:'pointer'}}>↩️</button>
              <button onClick={()=>{socketRef.current?.emit('canvas_clear',{});clearCanvas();}} style={{padding:'4px 8px',borderRadius:'6px',border:'none',background:'#7f1d1d',color:'#fff',cursor:'pointer'}}>🗑️</button>
            </div>
          )}
          <canvas ref={canvasRef} width={800} height={500}
            style={{display:'block',width:'100%',background:'#fff',cursor:isDrawer&&state.phase==='drawing'?(tool==='eraser'?'cell':'crosshair'):'default',touchAction:'none',borderRadius:'12px',flex:1}}
            onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}
            onTouchStart={handleMouseDown} onTouchMove={handleMouseMove} onTouchEnd={handleMouseUp}
          />
        </div>

        <div style={{width:'220px',flexShrink:0,display:'flex',flexDirection:'column',background:'#1a1a2e',borderRadius:'12px',overflow:'hidden'}}>
          <div style={{padding:'8px 12px',background:'#0f0f1a',fontWeight:800,fontSize:'13px',color:'#a5b4fc',borderBottom:'1px solid #2d2d4e'}}>💬 Chat</div>
          <div style={{flex:1,overflowY:'auto',padding:'8px',display:'flex',flexDirection:'column',gap:'3px',maxHeight:'500px'}}>
            {state.chatMessages.map((m,i)=>(
              <div key={i} style={{fontSize:'13px',lineHeight:'1.4',wordBreak:'break-word',...(m.type==='correct_guess'?{background:'#14532d',color:'#86efac',borderRadius:'6px',padding:'4px 8px',fontWeight:700}:{}),...(m.type==='system'?{color:'#6b7280',textAlign:'center',fontStyle:'italic',fontSize:'11px'}:{})}}>
                {m.type!=='system'&&<span style={{fontWeight:800,color:m.playerId===state.player?.id?'#818cf8':'#f9a8d4'}}>{m.playerName}: </span>}
                {m.text}
              </div>
            ))}
          </div>
          <ChatInput state={state} socket={socketRef.current} />
        </div>
      </div>

      {state.phase==='word_selection'&&isDrawer&&state.wordOptions.length>0&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.8)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:100}}>
          <div style={{background:'#1a1a2e',borderRadius:'20px',padding:'32px',textAlign:'center',border:'2px solid #4f46e5',minWidth:'320px'}}>
            <h2 style={{color:'#a5b4fc',marginBottom:'8px',fontSize:'22px'}}>Choose a word!</h2>
            <p style={{color:'#6b7280',marginBottom:'20px'}}>Others will try to guess it</p>
            {state.wordOptions.map(w=>(
              <button key={w} onClick={()=>socketRef.current?.emit('word_chosen',{word:w})}
                style={{display:'block',width:'100%',padding:'14px',borderRadius:'12px',border:'2px solid #2d2d4e',background:'#0f0f1a',color:'#fff',fontSize:'18px',cursor:'pointer',fontWeight:800,marginBottom:'10px'}}>
                {w}
              </button>
            ))}
          </div>
        </div>
      )}

      {state.phase==='game_over'&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.9)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:100}}>
          <div style={{background:'#1a1a2e',borderRadius:'20px',padding:'32px',textAlign:'center',border:'2px solid #4f46e5',minWidth:'360px'}}>
            <div style={{fontSize:'48px'}}>🎉</div>
            <h1 style={{color:'#a5b4fc',margin:'12px 0',fontWeight:800}}>Game Over!</h1>
            {state.winner&&<div style={{background:'#0f0f1a',borderRadius:'12px',padding:'16px',marginBottom:'16px'}}><b style={{fontSize:'20px'}}>{state.winner.name}</b> wins! 🏆<br/><span style={{color:'#f59e0b'}}>{state.winner.score} points</span></div>}
            {state.leaderboard.map((p,i)=>(
              <div key={p.id} style={{display:'flex',alignItems:'center',gap:'10px',padding:'10px',background:'#0f0f1a',borderRadius:'8px',marginBottom:'6px'}}>
                <span style={{fontSize:'18px'}}>{'🥇🥈🥉'[i]||`#${i+1}`}</span>
                <span style={{flex:1,fontWeight:700,textAlign:'left'}}>{p.name}</span>
                <span style={{color:'#818cf8',fontWeight:800}}>{p.score}pts</span>
              </div>
            ))}
            <button onClick={()=>window.location.reload()} style={{width:'100%',padding:'14px',borderRadius:'12px',border:'none',background:'#4f46e5',color:'#fff',fontSize:'18px',cursor:'pointer',fontWeight:800,marginTop:'12px'}}>🏠 Play Again</button>
          </div>
        </div>
      )}
    </div>
  );
}

function ChatInput({state, socket}) {
  const [input, setInput] = useState('');
  const isDrawer = state.player?.id===state.drawerId;
  const disabled = state.player?.hasGuessed||(isDrawer&&state.phase==='drawing');
  const send = () => {
    if(!input.trim()||disabled) return;
    if(state.phase==='drawing'&&!isDrawer&&!state.player?.hasGuessed) socket?.emit('guess',{text:input.trim()});
    else socket?.emit('chat',{text:input.trim()});
    setInput('');
  };
  return (
    <div style={{display:'flex',gap:'4px',padding:'8px',borderTop:'1px solid #2d2d4e'}}>
      <input style={{flex:1,padding:'8px',borderRadius:'8px',border:'1px solid #2d2d4e',background:'#0f0f1a',color:'#fff',fontSize:'13px',outline:'none',opacity:disabled?0.4:1}}
        placeholder={state.player?.hasGuessed?'✅ Guessed!':isDrawer&&state.phase==='drawing'?'Drawing...':state.phase==='drawing'?'Guess...':'Chat...'}
        value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} disabled={disabled}/>
      <button onClick={send} disabled={disabled} style={{padding:'8px',borderRadius:'8px',border:'none',background:'#4f46e5',color:'#fff',cursor:'pointer',opacity:disabled?0.4:1}}>➤</button>
    </div>
  );
}

function HomeScreen({connected, error, onCreate, onJoin}) {
  const [name, setName] = useState('');
  const [code, setCode] = useState('');
  const [tab, setTab] = useState('join');
  const [rounds, setRounds] = useState(3);
  const [drawTime, setDrawTime] = useState(80);
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}}>
      <div style={{background:'#1a1a2e',borderRadius:'20px',padding:'32px',width:'100%',maxWidth:'420px',border:'1px solid #2d2d4e'}}>
        <h1 style={{textAlign:'center',fontSize:'40px',marginBottom:'4px',color:'#818cf8',fontWeight:800}}>🎨 Skribbl</h1>
        <p style={{textAlign:'center',color:'#6b7280',marginBottom:'20px'}}>Draw. Guess. Win!</p>
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'6px',marginBottom:'16px'}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:connected?'#22c55e':'#ef4444'}}/>
          <span style={{fontSize:'13px',color:connected?'#22c55e':'#ef4444'}}>{connected?'Connected':'Connecting...'}</span>
        </div>
        <input style={{marginBottom:'12px'}} placeholder="Your name..." value={name} onChange={e=>setName(e.target.value)} maxLength={20}/>
        <div style={{display:'flex',gap:'8px',marginBottom:'16px'}}>
          {['join','create'].map(t=><button key={t} onClick={()=>setTab(t)} style={{flex:1,padding:'10px',borderRadius:'10px',border:'none',background:tab===t?'#4f46e5':'#2d2d4e',color:'#fff',cursor:'pointer',fontWeight:700}}>{t==='join'?'🚪 Join':'➕ Create'}</button>)}
        </div>
        {tab==='join'?(
          <div>
            <input style={{marginBottom:'12px',textAlign:'center',letterSpacing:'4px',fontSize:'20px',textTransform:'uppercase'}} placeholder="Room Code" value={code} onChange={e=>setCode(e.target.value.toUpperCase())} maxLength={6} onKeyDown={e=>e.key==='Enter'&&onJoin(name,code)}/>
            <button className="btn btn-primary" style={{width:'100%',padding:'14px',borderRadius:'12px',border:'none',background:'#4f46e5',color:'#fff',fontSize:'18px',cursor:'pointer',fontWeight:800}} onClick={()=>{if(!name.trim())return alert('Enter name!');if(!code.trim())return alert('Enter code!');onJoin(name,code);}}>Join Game</button>
          </div>
        ):(
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',background:'#0f0f1a',borderRadius:'8px',marginBottom:'8px'}}>
              <span>Rounds</span>
              <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                <button onClick={()=>setRounds(r=>Math.max(1,r-1))} style={{width:28,height:28,borderRadius:'6px',border:'none',background:'#2d2d4e',color:'#fff',cursor:'pointer',fontSize:'16px'}}>−</button>
                <span style={{fontWeight:800,minWidth:'20px',textAlign:'center'}}>{rounds}</span>
                <button onClick={()=>setRounds(r=>Math.min(10,r+1))} style={{width:28,height:28,borderRadius:'6px',border:'none',background:'#2d2d4e',color:'#fff',cursor:'pointer',fontSize:'16px'}}>+</button>
              </div>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',background:'#0f0f1a',borderRadius:'8px',marginBottom:'12px'}}>
              <span>Draw Time</span>
              <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                <button onClick={()=>setDrawTime(t=>Math.max(15,t-5))} style={{width:28,height:28,borderRadius:'6px',border:'none',background:'#2d2d4e',color:'#fff',cursor:'pointer',fontSize:'16px'}}>−</button>
                <span style={{fontWeight:800,minWidth:'30px',textAlign:'center'}}>{drawTime}s</span>
                <button onClick={()=>setDrawTime(t=>Math.min(240,t+5))} style={{width:28,height:28,borderRadius:'6px',border:'none',background:'#2d2d4e',color:'#fff',cursor:'pointer',fontSize:'16px'}}>+</button>
              </div>
            </div>
            <button style={{width:'100%',padding:'14px',borderRadius:'12px',border:'none',background:'#4f46e5',color:'#fff',fontSize:'18px',cursor:'pointer',fontWeight:800}} onClick={()=>{if(!name.trim())return alert('Enter name!');onCreate(name,{rounds,drawTime,maxPlayers:8,wordCount:3});}}>Create Room</button>
          </div>
        )}
        {error&&<div style={{marginTop:'12px',padding:'10px',borderRadius:'8px',background:'#450a0a',color:'#fca5a5',textAlign:'center',fontWeight:700}}>⚠️ {error}</div>}
      </div>
    </div>
  );
}

function LobbyScreen({state, onStart}) {
  const copy = () => { navigator.clipboard.writeText(state.roomCode); alert('Copied!'); };
  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'20px',gap:'16px'}}>
      <h1 style={{color:'#818cf8',fontWeight:800,fontSize:'36px'}}>🎨 Skribbl</h1>
      <div style={{display:'flex',gap:'16px',flexWrap:'wrap',justifyContent:'center',width:'100%',maxWidth:'700px'}}>
        <div style={{background:'#1a1a2e',borderRadius:'16px',padding:'20px',flex:1,minWidth:'260px',border:'1px solid #2d2d4e'}}>
          <p style={{color:'#a5b4fc',fontSize:'12px',fontWeight:800,textTransform:'uppercase',marginBottom:'8px'}}>Room Code</p>
          <div style={{display:'flex',alignItems:'center',gap:'10px',background:'#0f0f1a',borderRadius:'10px',padding:'10px 14px',marginBottom:'12px'}}>
            <span style={{fontWeight:800,fontSize:'28px',letterSpacing:'6px',color:'#818cf8',flex:1}}>{state.roomCode}</span>
            <button onClick={copy} style={{padding:'6px 12px',borderRadius:'8px',border:'none',background:'#2d2d4e',color:'#fff',cursor:'pointer',fontWeight:700}}>📋</button>
          </div>
          {state.player?.isHost?(
            <button onClick={onStart} disabled={state.players.length<2}
              style={{width:'100%',padding:'14px',borderRadius:'12px',border:'none',background:state.players.length<2?'#1a3a1a':'#22c55e',color:'#fff',fontSize:'18px',cursor:state.players.length<2?'not-allowed':'pointer',fontWeight:800}}>
              {state.players.length<2?'Need 2+ players':'🚀 Start Game!'}
            </button>
          ):(
            <div style={{textAlign:'center',color:'#6b7280',padding:'14px',background:'#0f0f1a',borderRadius:'10px'}}>⏳ Waiting for host...</div>
          )}
        </div>
        <div style={{background:'#1a1a2e',borderRadius:'16px',padding:'20px',flex:1,minWidth:'260px',border:'1px solid #2d2d4e'}}>
          <p style={{color:'#a5b4fc',fontSize:'12px',fontWeight:800,textTransform:'uppercase',marginBottom:'8px'}}>Players ({state.players.length})</p>
          {state.players.map(p=>(
            <div key={p.id} style={{display:'flex',alignItems:'center',gap:'10px',padding:'8px',background:'#0f0f1a',borderRadius:'8px',marginBottom:'6px'}}>
              <div style={{width:36,height:36,borderRadius:'50%',background:p.avatar,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,color:'#fff'}}>{p.name[0].toUpperCase()}</div>
              <span style={{flex:1,fontWeight:700}}>{p.name}</span>
              {p.id===state.player?.id&&<span style={{padding:'2px 8px',borderRadius:'99px',background:'#4f46e5',color:'#fff',fontSize:'11px',fontWeight:800}}>You</span>}
              {p.isHost&&<span>👑</span>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
